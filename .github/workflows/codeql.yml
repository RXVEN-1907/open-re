# CodeQL - advanced setup, scoped to the languages this repo actually has.
# The default setup detected stray JS/TS fragments it could not process and
# failed every run; rust requires the advanced setup regardless.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - uses: github/codeql-action/autobuild@v3
        if: matrix.build-mode == 'autobuild'

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
