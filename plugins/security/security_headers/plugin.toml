name = "security_headers"
version = "0.1.0"
description = "Checks for security headers including Content-Security-Policy, Strict-Transport-Security, X-Frame-Options, Referrer-Policy, Permissions-Policy, X-Content-Type-Options, Cache-Control, and cross-origin isolation headers"
author = "open-re Team"
license = "MIT"
repository = "https://github.com/open-re/open-re"
homepage = "https://github.com/open-re/open-re"

[plugin]
type = "security"
capabilities = ["ReadBinary", "WriteAnnotations", "QueryDatabase", "NetworkAccess", "ReadConfig"]
min_core_version = "0.1.0"
max_core_version = "1.0.0"

[plugin.entry]
wasm = "security_headers.wasm"
native = { linux = "libsecurity_headers.so", macos = "libsecurity_headers.dylib", windows = "security_headers.dll" }

[build]
target = "wasm"
rust_version = "1.75"
features = []

[resources]
max_memory_mb = 256
max_fuel = 10000000
max_execution_time_secs = 300

[ui]
views = []
panels = []
menus = []

[config]
schema = "config_schema.json"
defaults = {}