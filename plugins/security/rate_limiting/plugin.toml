name = "rate_limiting"
version = "0.1.0"
description = "Safely determines whether basic request throttling exists, authentication endpoints enforce limits, and APIs expose unrestricted request rates"
author = "open-re Team"
license = "MIT"
repository = "https://github.com/open-re/open-re"
homepage = "https://github.com/open-re/open-re"

[plugin]
type = "security"
capabilities = ["ReadBinary", "WriteAnnotations", "QueryDatabase", "NetworkAccess", "ReadConfig"]
min_core_version = "0.1.0"
max_core_version = "1.0.0"

[plugin.entry]
wasm = "rate_limiting.wasm"
native = { linux = "librate_limiting.so", macos = "librate_limiting.dylib", windows = "rate_limiting.dll" }

[build]
target = "wasm"
rust_version = "1.75"
features = []

[resources]
max_memory_mb = 256
max_fuel = 10000000
max_execution_time_secs = 300

[ui]
views = []
panels = []
menus = []

[config]
schema = "config_schema.json"
defaults = {}