name = "file_upload"
version = "1.0.0"
description = "Evaluates file upload mechanisms for security issues including allowed extensions, MIME type validation, size restrictions, filename handling, storage behavior, and dangerous configurations"
author = "open-re Team"
license = "MIT"
repository = "https://github.com/open-re/open-re"
homepage = "https://github.com/open-re/open-re"

[plugin]
type = "security"
capabilities = ["NetworkAccess", "ReadConfig"]
min_core_version = "0.1.0"
max_core_version = "1.0.0"

[plugin.entry]
wasm = "file_upload.wasm"
native = { linux = "libfile_upload.so", macos = "libfile_upload.dylib", windows = "file_upload.dll" }

[build]
target = "wasm"
rust_version = "1.75"
features = []

[resources]
max_memory_mb = 256
max_fuel = 10000000
max_execution_time_secs = 300

[ui]
views = []
panels = []
menus = []

[config]
schema = "config_schema.json"
defaults = {}