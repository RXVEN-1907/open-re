name = "session_management"
version = "0.1.0"
description = "Analyzes session management including session cookie generation, expiration, invalidation after logout, cookie rotation after authentication, and session fixation indicators"
author = "open-re Team"
license = "MIT"
repository = "https://github.com/open-re/open-re"
homepage = "https://github.com/open-re/open-re"

[plugin]
type = "security"
capabilities = ["ReadBinary", "WriteAnnotations", "QueryDatabase", "NetworkAccess", "ReadConfig"]
min_core_version = "0.1.0"
max_core_version = "1.0.0"

[plugin.entry]
wasm = "session_management.wasm"
native = { linux = "libsession_management.so", macos = "libsession_management.dylib", windows = "session_management.dll" }

[build]
target = "wasm"
rust_version = "1.75"
features = []

[resources]
max_memory_mb = 256
max_fuel = 10000000
max_execution_time_secs = 300

[ui]
views = []
panels = []
menus = []

[config]
schema = "config_schema.json"
defaults = {}