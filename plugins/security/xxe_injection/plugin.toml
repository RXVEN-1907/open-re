name = "xxe_injection"
version = "1.0.0"
description = "Detects XML External Entity (XXE) vulnerabilities using controlled payloads"
author = "open-re Team"
license = "MIT"
repository = "https://github.com/open-re/open-re"
homepage = "https://github.com/open-re/open-re"

[plugin]
type = "security"
capabilities = ["NetworkAccess", "ReadConfig"]
min_core_version = "0.1.0"
max_core_version = "1.0.0"

[plugin.entry]
wasm = "xxe_injection.wasm"
native = { linux = "libxxe_injection.so", macos = "libxxe_injection.dylib", windows = "xxe_injection.dll" }

[build]
target = "wasm"
rust_version = "1.75"
features = []

[resources]
max_memory_mb = 256
max_fuel = 10000000
max_execution_time_secs = 300

[ui]
views = []
panels = []
menus = []

[config]
schema = "config_schema.json"
defaults = {}