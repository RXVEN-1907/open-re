name = "cookie_security"
version = "0.1.0"
description = "Validates cookie security attributes including Secure flag, HttpOnly flag, SameSite policy, Domain scope, Path scope, Expiration, and Weak or predictable cookie patterns"
author = "open-re Team"
license = "MIT"
repository = "https://github.com/open-re/open-re"
homepage = "https://github.com/open-re/open-re"

[plugin]
type = "security"
capabilities = ["ReadBinary", "WriteAnnotations", "QueryDatabase", "NetworkAccess", "ReadConfig"]
min_core_version = "0.1.0"
max_core_version = "1.0.0"

[plugin.entry]
wasm = "cookie_security.wasm"
native = { linux = "libcookie_security.so", macos = "libcookie_security.dylib", windows = "cookie_security.dll" }

[build]
target = "wasm"
rust_version = "1.75"
features = []

[resources]
max_memory_mb = 256
max_fuel = 10000000
max_execution_time_secs = 300

[ui]
views = []
panels = []
menus = []

[config]
schema = "config_schema.json"
defaults = {}