[package]
name = "openre-scanner"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Security scanning engine for open-re"
categories = ["security", "development-tools"]
keywords = ["security", "scanning", "vulnerability", "web-application", "api"]

[dependencies]
# Core workspace dependencies
openre-core = { path = "../openre-core" }
openre-config = { path = "../openre-config" }
openre-telemetry = { path = "../openre-telemetry" }
openre-storage = { path = "../openre-storage" }
openre-queue = { path = "../openre-queue" }
# openre-plugins = { path = "../openre-plugins" }  # Temporarily disabled

# External dependencies
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
reqwest = { workspace = true }
validator = { workspace = true }
urlencoding = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
figment = { workspace = true }
config = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
colored = { workspace = true }
url = { workspace = true, features = ["serde"] }
base64 = { workspace = true }
http = { workspace = true }

# HTTP client for scanning
http-body = "0.4"
hyper = { version = "1.0", features = ["full", "client", "http1", "http2"] }
hyper-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "1.0"
webpki-roots = "0.25"

# API layer
axum = { workspace = true }
utoipa = { workspace = true, features = ["chrono"] }
sqlx = { workspace = true }
toml = "0.8"
tracing-subscriber = { workspace = true }

# For plugin system
wasmtime = { workspace = true }
wasmparser = { workspace = true }

# For TUI
ratatui = "0.26"
crossterm = "0.27"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
tempfile = "3.8"