[package]
name = "openre-api"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "API server (HTTP/gRPC) for open-re"
categories = { workspace = true }
keywords = { workspace = true }

[[bin]]
name = "openre-api"
path = "src/main.rs"

[features]
default = ["ai"]
ai = ["dep:openre-ai", "dep:openre-security-ai", "dep:openre-scanner", "dep:openre-plugins", "dep:rusqlite"]

[dependencies]
openre-core = { path = "../openre-core" }
openre-config = { path = "../openre-config" }
openre-telemetry = { path = "../openre-telemetry" }
openre-storage = { path = "../openre-storage" }
openre-queue = { path = "../openre-queue" }
openre-ai = { path = "../openre-ai", optional = true }
openre-plugins = { path = "../openre-plugins", optional = true }
axum = { workspace = true, features = ["multipart", "ws"] }
axum-extra = { workspace = true, features = ["cookie"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["compression-full", "limit", "cors"] }
tonic = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
validator = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
redis = { workspace = true }
openre-scanner = { path = "../openre-scanner", optional = true }
openre-security-ai = { path = "../openre-security-ai", optional = true }
base64 = { workspace = true }
rusqlite = { workspace = true, optional = true }