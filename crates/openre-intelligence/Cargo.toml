[package]
name = "openre-intelligence"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Intelligence layer for open-re - correlation, CVE matching, dependency analysis, knowledge base"

[dependencies]
openre-core = { path = "../openre-core" }
openre-config = { path = "../openre-config" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
regex = "1.0"
semver = "1.0"
indexmap = "2.0"
colored = "2.0"
petgraph = { version = "0.6", features = ["serde"] }

[features]
default = ["full"]
full = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }