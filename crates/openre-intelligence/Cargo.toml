[package]
name = "openre-intelligence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Intelligence layer for open-re security scanner - correlation, CVE matching, dependency analysis, and knowledge base"

[dependencies]
# Workspace dependencies
openre-core = { path = "../openre-core" }
openre-storage = { path = "../openre-storage" }
openre-scanner = { path = "../openre-scanner" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }

# External dependencies
reqwest = { workspace = true, features = ["json"] }
sha2 = { workspace = true }
url = { workspace = true }
regex = "1.0"
semver = "1.0"
indexmap = "2.0"
colored = "2.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3.8"