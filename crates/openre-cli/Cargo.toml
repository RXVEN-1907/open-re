[package]
name = "openre-cli"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
openre-core = { version = "0.1.0", path = "../openre-core" }
openre-intelligence = { version = "0.1.0", path = "../openre-intelligence" }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json", "tcp"] }
select = { version = "0.7", default-features = false }

[features]
default = ["scan", "analysis", "ai", "report", "config"]
scan = []
analysis = []
ai = []
report = []
config = []
schedule = []
hunt = []  # New feature for instant security assessment with viral mechanics
