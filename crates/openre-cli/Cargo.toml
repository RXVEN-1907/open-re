[package]
name = "openre-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "CLI for open-re"
categories = { workspace = true }
keywords = { workspace = true }

[[bin]]
name = "openre"
path = "src/main.rs"

[dependencies]
openre-core = { path = "../openre-core" }
openre-config = { path = "../openre-config" }
openre-telemetry = { path = "../openre-telemetry" }
openre-storage = { path = "../openre-storage" }
openre-queue = { path = "../openre-queue" }
openre-ai = { path = "../openre-ai" }
openre-analysis = { path = "../openre-analysis" }
# openre-plugins = { path = "../openre-plugins" }  # Temporarily disabled
openre-api = { path = "../openre-api" }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
indicatif = "0.17"
colored = "2.0"
tabled = { version = "0.16", features = ["derive"] }
serde_yaml = { workspace = true }
toml = "0.8"
urlencoding = { workspace = true }
dirs = "5.0"
futures = { workspace = true }
goblin = { workspace = true }
wasmparser = { workspace = true }
object = { workspace = true }
scroll = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"] }