[package]
name = "openre-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "openre: Unified reverse engineering & offensive security CLI"
categories = { workspace = true }
keywords = { workspace = true }

[[bin]]
name = "openre"
path = "src/main.rs"

[dependencies]
openre-core = { path = "../openre-core" }
openre-config = { path = "../openre-config" }
openre-analysis = { path = "../openre-analysis", optional = true }
openre-scan = { path = "../openre-scan", optional = true }
openre-ai = { path = "../openre-ai", optional = true }
openre-queue = { path = "../openre-queue", optional = true }
openre-telemetry = { path = "../openre-telemetry", optional = true }

clap = { version = "4.5", features = ["derive", "env", "wrap_help", "help", "usage", "suggestions", "cargo"] }
clap_complete = "4.5"
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.150" }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
indicatif = { workspace = true }
colored = { workspace = true }
console = { workspace = true }
dialoguer = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tabled = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
goblin = { workspace = true }
object = { workspace = true }
scroll = { workspace = true }
hex = "0.4"
sarif_rust = { version = "0.3", optional = true }

[features]
default = ["full"]
full = ["analysis", "scan", "ai", "queue", "sarif"]
analysis = ["dep:openre-analysis"]
scan = ["dep:openre-scan"]
ai = ["dep:openre-ai"]
queue = ["dep:openre-queue", "dep:openre-telemetry"]
sarif = ["dep:sarif_rust"]
minimal = []