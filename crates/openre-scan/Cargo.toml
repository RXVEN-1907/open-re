[package]
name = "openre-scan"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Lightweight standalone security scanner"
categories = ["security", "command-line-utilities"]
keywords = ["security", "scanner", "vulnerability", "cli", "tui"]

[[bin]]
name = "openre-scan"
path = "src/main.rs"

[dependencies]
openre-core = { path = "../openre-core" }
openre-config = { path = "../openre-config" }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
tabled = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
html5ever = "0.39"
select = "0.6"
markup5ever_rcdom = "0.39"
cookie = "0.16"
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }
x509-parser = "0.16"
pem = "1.0"
toml = { workspace = true }

# TUI (optional)
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]
minimal = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true