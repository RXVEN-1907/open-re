[package]
name = "openre-storage"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Storage abstractions (PostgreSQL, SQLite, S3) for open-re"
categories = { workspace = true }
keywords = { workspace = true }

[features]
default = ["postgres", "redis", "sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/runtime-tokio-rustls", "sqlx/chrono", "sqlx/uuid", "sqlx/migrate", "sqlx/macros"]
redis = ["dep:redis", "redis/tokio-comp", "redis/streams", "redis/script", "redis/connection-manager"]
sqlite = ["rusqlite/bundled", "rusqlite/serde_json", "rusqlite/chrono", "rusqlite/uuid"]
s3 = []  # For future AWS S3 support

[dependencies]
openre-core = { path = "../openre-core" }
openre-config = { path = "../openre-config" }
openre-telemetry = { path = "../openre-telemetry" }
sqlx = { workspace = true, default-features = false, optional = true }
redis = { workspace = true, default-features = false, optional = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
rusqlite = { version = "0.31", default-features = false, features = ["bundled", "serde_json", "chrono", "uuid"] }
goblin = { workspace = true }
object = { workspace = true }
scroll = { workspace = true }
# pe = { workspace = true }  # Has alignment issues, using goblin for PE parsing instead
xmas-elf = { workspace = true }
# aws-sdk-s3 = { version = "0.30", features = ["behavior-version-latest"] }
# aws-config = { version = "0.30", features = ["behavior-version-latest"] }
# aws-types = { version = "0.30" }
dashmap = "5.5"
once_cell = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }