<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    :root { --canvas: #0D0E12; --lav: #BDB2FF; --acc: #F0A431; --edge: #2A2D37; --byte: #23262F; }
    @media (prefers-color-scheme: light) {
      :root { --canvas: #FBFBFC; --lav: #7A6EE6; --acc: #B97A0A; --edge: #D8D8DE; --byte: #E4E4EA; }
    }
  </style>
  <defs>
    <clipPath id="badge"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect x="8" y="8" width="240" height="240" fill="var(--canvas)"/>
    <!-- byte matrix: the target's memory, fading toward the core -->
    <g fill="var(--byte)">
      <rect x="50" y="24" width="10" height="10" rx="2" opacity="0.55"/><rect x="76" y="24" width="10" height="10" rx="2" opacity="0.55"/><rect x="128" y="24" width="10" height="10" rx="2" opacity="0.55"/><rect x="154" y="24" width="10" height="10" rx="2" opacity="0.55"/><rect x="206" y="24" width="10" height="10" rx="2" opacity="0.55"/><rect x="24" y="50" width="10" height="10" rx="2" opacity="0.5"/><rect x="76" y="50" width="10" height="10" rx="2" opacity="0.5"/><rect x="102" y="50" width="10" height="10" rx="2" opacity="0.5"/><rect x="154" y="50" width="10" height="10" rx="2" opacity="0.5"/><rect x="180" y="50" width="10" height="10" rx="2" opacity="0.5"/><rect x="24" y="76" width="10" height="10" rx="2" opacity="0.45000000000000007"/><rect x="50" y="76" width="10" height="10" rx="2" opacity="0.45000000000000007"/><rect x="102" y="76" width="10" height="10" rx="2" opacity="0.45000000000000007"/><rect x="128" y="76" width="10" height="10" rx="2" opacity="0.45000000000000007"/><rect x="180" y="76" width="10" height="10" rx="2" opacity="0.45000000000000007"/><rect x="206" y="76" width="10" height="10" rx="2" opacity="0.45000000000000007"/><rect x="50" y="102" width="10" height="10" rx="2" opacity="0.4"/><rect x="76" y="102" width="10" height="10" rx="2" opacity="0.4"/><rect x="128" y="102" width="10" height="10" rx="2" opacity="0.4"/><rect x="154" y="102" width="10" height="10" rx="2" opacity="0.4"/><rect x="206" y="102" width="10" height="10" rx="2" opacity="0.4"/><rect x="24" y="128" width="10" height="10" rx="2" opacity="0.35000000000000003"/><rect x="76" y="128" width="10" height="10" rx="2" opacity="0.35000000000000003"/><rect x="102" y="128" width="10" height="10" rx="2" opacity="0.35000000000000003"/><rect x="154" y="128" width="10" height="10" rx="2" opacity="0.35000000000000003"/><rect x="180" y="128" width="10" height="10" rx="2" opacity="0.35000000000000003"/><rect x="24" y="154" width="10" height="10" rx="2" opacity="0.30000000000000004"/><rect x="50" y="154" width="10" height="10" rx="2" opacity="0.30000000000000004"/><rect x="102" y="154" width="10" height="10" rx="2" opacity="0.30000000000000004"/><rect x="128" y="154" width="10" height="10" rx="2" opacity="0.30000000000000004"/><rect x="180" y="154" width="10" height="10" rx="2" opacity="0.30000000000000004"/><rect x="206" y="154" width="10" height="10" rx="2" opacity="0.30000000000000004"/><rect x="50" y="180" width="10" height="10" rx="2" opacity="0.25"/><rect x="76" y="180" width="10" height="10" rx="2" opacity="0.25"/><rect x="128" y="180" width="10" height="10" rx="2" opacity="0.25"/><rect x="154" y="180" width="10" height="10" rx="2" opacity="0.25"/><rect x="206" y="180" width="10" height="10" rx="2" opacity="0.25"/><rect x="24" y="206" width="10" height="10" rx="2" opacity="0.2"/><rect x="76" y="206" width="10" height="10" rx="2" opacity="0.2"/><rect x="102" y="206" width="10" height="10" rx="2" opacity="0.2"/><rect x="154" y="206" width="10" height="10" rx="2" opacity="0.2"/><rect x="180" y="206" width="10" height="10" rx="2" opacity="0.2"/>
    </g>
    <!-- scan arcs: lavender everywhere, one accent sweep -->
    <g fill="none" stroke-linecap="round">
      <circle cx="128" cy="128" r="96" stroke="var(--byte)" stroke-width="3"/>
      <path d="M 128 20 A 108 108 0 0 1 227 91" stroke="var(--lav)" stroke-width="10" opacity="0.95"/>
      <path d="M 236 128 A 108 108 0 0 1 128 236" stroke="var(--lav)" stroke-width="10" opacity="0.55"/>
      <path d="M 20 128 A 108 108 0 0 1 74 34" stroke="var(--acc)" stroke-width="10"/>
      <path d="M 96 42 A 92 92 0 0 1 214 96" stroke="var(--acc)" stroke-width="5" opacity="0.5"/>
      <circle cx="128" cy="128" r="58" stroke="var(--lav)" stroke-width="6" opacity="0.8"/>
    </g>
    <!-- the core: what the scanner found -->
    <circle cx="128" cy="128" r="20" fill="var(--acc)"/>
    <circle cx="128" cy="128" r="30" fill="none" stroke="var(--acc)" stroke-width="3" opacity="0.45"/>
    <circle cx="128" cy="128" r="6" fill="var(--canvas)"/>
    <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="var(--edge)" stroke-width="2"/>
  </g>
</svg>
