[workspace]
resolver = "2"
members = [
    "crates/openre-core",
    "crates/openre-config",
    "crates/openre-scan",
    "crates/openre-cli",
]

exclude = [
    "frontend",
    "docker",
    "docs",
    "crates/openre-api",
    "crates/openre-queue",
    "crates/openre-storage",
    "crates/openre-telemetry",
    "crates/openre-scanner",
    "crates/openre-recon",
    "crates/openre-security-ai",
    "crates/openre-plugins",
    "crates/openre-plugins-macros",
    "crates/openre-tui",
    "crates/sentinel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/RXVEN-1907/open-re"
description = "openre: Unified reverse engineering & offensive security CLI - binary analysis, web scanning, AI-powered vuln discovery, PoC generation, remediation"
categories = ["command-line-utilities", "security", "reverse-engineering"]
keywords = ["security", "reverse-engineering", "vulnerability", "binary-analysis", "ai", "llm", "poc", "remediation"]

[workspace.dependencies]
# Core
tokio = { version = "1.53", features = ["full", "tracing", "macros", "rt-multi-thread"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
dashmap = "6.2"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
once_cell = "1.21"
parking_lot = "0.12"
bytes = "1.12"
base64 = "0.23"
hex = "0.4"
notify = "6.1"
num_cpus = "1.16"
regex = "1.13"
sha2 = "0.11"
blake3 = "1.8"
rand = "0.9"
fastrand = "2.4"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart", "gzip", "brotli", "cookies"] }
url = "2.5"
http = "0.2"

# Binary parsing
goblin = { version = "0.7", features = ["std"] }
object = { version = "0.35", features = ["std"] }
scroll = "0.13"
xmas-elf = "0.10"
wasmparser = "0.215"

# HTML parsing for web scanning
select = { version = "0.7", features = ["html"] }
html5ever = "0.26"
markup5ever = "0.11"

# Local AI/ML (optional - configure in openre-ai/Cargo.toml)
# ort = { version = "1.16", features = ["load-model", "dynamic"] }
# llama-cpp-2 = { version = "0.1", features = ["metal", "cuda", "vulkan", "blas"] }
# tokenizers = "0.15"
# candle-core = "0.5"
# candle-nn = "0.5"
# candle-transformers = "0.5"

# Config
figment = { version = "0.10", features = ["toml", "env", "json", "yaml"] }
config = { version = "0.15", features = ["toml", "yaml", "ini"] }
serde_yaml = "0.9"
toml = "0.8"
dirs = "5.0"

# Scanner extras
rustls = "0.23"
rustls-pemfile = "1.0"
webpki-roots = "0.25"
x509-parser = "0.16"
pem = "1.0"
cookie = "0.16"
markup5ever_rcdom = "0.39"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "help", "usage", "suggestions", "cargo"] }
clap_complete = "4.5"
indicatif = "0.18"
colored = "2.0"
console = "0.15"
dialoguer = "0.11"

# TUI
ratatui = "0.26"
crossterm = "0.27"

# Output formatting
tabled = { version = "0.16", features = ["derive"] }
sarif_rust = "0.3"

# Testing
tempfile = "3.8"
mockall = "0.12"
proptest = "1.4"
test-case = "3.0"

# Benchmarking
criterion = "0.5"

[workspace.lints.rust]
unused_crate_dependencies = "allow"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
rust_2021_idioms = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true

[patch.crates-io]
select = { path = ".patched-crates/select-patched" }

# Features for the unified binary
[workspace.features]
default = ["cloud-ai", "binary-analysis", "web-scan", "intelligence", "sarif-output"]
# local-ai = ["crates/openre-ai/local-ai"]
cloud-ai = ["crates/openre-ai/cloud-ai"]
binary-analysis = ["crates/openre-analysis/full"]
web-scan = ["crates/openre-scan/full"]
intelligence = ["crates/openre-intelligence/full"]
sarif-output = ["crates/openre-cli/sarif"]
minimal = []  # Just core CLI, no AI, no binary analysis, no web scan