[workspace]
resolver = "2"
members = [
    "crates/openre-core",
    "crates/openre-config",
    "crates/openre-scan",
    "crates/openre-analysis",
    "crates/openre-ai",
    "crates/openre-intelligence",
    "crates/openre-cli",
    "crates/openre-tui",
    "crates/openre-plugins",
    "crates/openre-plugins-macros",
    "crates/openre-telemetry",
    "crates/sentinel",
    "crates/openre-disasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/RXVEN-1907/open-re"
description = "openre: Open-source reverse engineering & offensive security platform"
categories = ["command-line-utilities", "security", "reverse-engineering"]
keywords = ["security", "scanner", "vulnerability", "web", "binary", "reverse-engineering", "ai", "llm"]

[workspace.dependencies]
# Core
tokio = { version = "1.53", features = ["full", "tracing", "macros", "rt-multi-thread"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
async-trait = "0.1"
once_cell = "1.21"
parking_lot = "0.12"
bytes = "1.12"
base64 = "0.23"
hex = "0.4"
regex = "1.13"
sha2 = "0.11"
blake3 = "1.8"
rand = "0.9"
fastrand = "2.4"
dashmap = "6.2"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["full"] }
sha1 = "0.10"
md5 = { package = "md-5", version = "0.10" }
semver = "1.0"
indexmap = "2.0"
petgraph = { version = "0.6", features = ["serde"] }
colored = "2.0"
urlencoding = { version = "1.0", features = [] }
metrics = "0.21"
metrics-exporter-prometheus = "0.13"
prometheus = "0.13"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart", "gzip", "brotli", "cookies"] }
url = "2.5"
http = "0.2"
http-body = "0.4"
hyper = { version = "1.0", features = ["full", "client", "http1", "http2"] }
hyper-rustls = "0.24"
rustls = "0.23"
rustls-pemfile = "1.0"
rustls-pki-types = "1.0"
webpki-roots = "0.25"
x509-parser = "0.16"
pem = "1.0"
cookie = "0.16"
markup5ever_rcdom = "0.39"

# HTML parsing for web scanning
select = { version = "0.7", features = ["html"] }
html5ever = "0.26"
markup5ever = "0.11"

# Config
figment = { version = "0.10", features = ["toml", "env", "json", "yaml"] }
config = { version = "0.15", features = ["toml", "yaml", "ini"] }
serde_yaml = "0.9"
toml = "0.8"
dirs = "5.0"
validator = { version = "0.19", features = ["derive"] }

# Binary Analysis
goblin = "0.8"
object = "0.37"
scroll = "0.12"
wasmparser = "0.215"
wasm-encoder = "0.215"
xmas-elf = "0.10"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "help", "usage", "suggestions", "cargo"] }
clap_complete = "4.5"
indicatif = "0.18"
console = "0.15"
dialoguer = "0.11"
num_cpus = "1.16"

# TUI
ratatui = "0.26"
crossterm = "0.27"

# Output formatting
tabled = { version = "0.16", features = ["derive"] }
sarif_rust = "0.3"

# AI/ML
ort = { version = "1.17", features = ["load-dynamic"] }
llama-cpp-2 = { version = "0.10", features = ["metal", "cuda", "accelerate"] }
candle-core = { version = "0.8", features = ["cuda", "metal"] }
tokenizers = "0.19"

# Plugins
libloading = "0.8"
wasmtime = { version = "20.0", features = ["component-model", "async"] }
wasmtime-wasi = { version = "20.0", features = ["preview1"] }
notify = { version = "6.1", features = ["mio"] }
utoipa = { version = "5.5", features = ["chrono", "actix_extras", "macros"] }
utoipa-swagger-ui = { version = "7.0", features = ["axum"] }
utoipa-gen = { version = "5.5" }

# Testing
tempfile = "3.8"
mockall = "0.12"
proptest = "1.4"
test-case = "3.0"
tokio-test = "0.4"
wat = "1.0"
wiremock = "0.5"

# Benchmarking
criterion = "0.5"

# Network
pnet = "0.36"
trust-dns-resolver = { version = "0.23", features = ["tokio"] }

# Crypto
ring = "0.17"
p256 = "0.13"
ed25519-dalek = "2.0"

# Serialization
bincode = "1.3"
rmp-serde = "1.1"

# Compression
flate2 = "1.0"
zstd = "0.13"

# Macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

[workspace.lints.rust]
unused_crate_dependencies = "allow"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
rust_2021_idioms = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false

[profile.release-lto]
inherits = "release"
lto = "fat"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true

[patch.crates-io]
select = { path = ".patched-crates/select-patched" }